# Local instance configuration example.
# Copy outside Git, e.g. ~/.config/gzcoord/<project>.yaml.
#
# `identity` is informational: the runtime derives the address from the
# operating system (host = short hostname, instance = the login of the
# account the session runs under — agent-fabric's runtime/identity.py)
# and never from this file or from the working directory.
identity:
  host: develop-qzapp
  instance: backend-dev-02

# `role.name` is the SLUG of the role the agent currently holds — its
# runtime binding, written by `/role` (tools/fabric/role.py) — and
# `specialties`/`capabilities` follow the same source. Never authored
# independently. GZCoord keeps no role catalog of its own; the slugs are
# agent-fabric's identities/roles/catalog.json (runtime/README.md,
# "Role sourcing").
role:
  name: backend-dev
  specialties:
    - .NET backend
    - persistence
    - contracts
  capabilities:
    - github
    - code-review
    - repository-analysis

# The logical project the agent is bound to (projects/registry.json),
# not the working-copy directory name.
project:
  name: gzapp

runtime:
  # Local execution detail. Never sent in GZCOORD messages.
  provider: openrouter
  model: z-ai/glm-5.3

subagents:
  enabled: true
  max_parallel: 4
  max_depth: 1
  capabilities:
    analyze: true
    research: true
    review: true
    implement: false
    commit: false
    push: false
    merge: false
    create_pr: false
    architecture_decision: false

transport:
  # The reference transport is a human relay: a person copies messages
  # between session terminals (../docs/HUMAN-RELAY-TRANSPORT.md). It has
  # no credentials and no state. A project may run an automated relay
  # instead (gzapp: projects/gzapp/integration/gzcoord/BRIDGE-RELAY-SETUP.md).
  # The first automated attempt is retired in ../history/telegram-transport/.
  adapter: human-relay
  # Transport-specific credentials/mapping stay outside the protocol.
