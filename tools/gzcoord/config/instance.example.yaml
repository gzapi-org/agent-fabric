# Local instance configuration example.
# Copy outside Git, e.g. ~/.config/gzcoord/gzapp.yaml.
identity:
  host: develop-gzapp
  instance: gzapp

# `role.name`, `specialties` and `capabilities` should match the role
# this working copy currently holds under the .roles/ system
# (.roles/taxonomy.json — see `tools/roles/switch.py --status`), not
# be authored independently. GZCoord keeps no role catalog of its own;
# see runtime/README.md "Role sourcing".
role:
  name: Application Architect
  specialties:
    - architecture
    - ADR
    - contracts
    - system design
  capabilities:
    - github
    - code-review
    - repository-analysis

project:
  name: gzapp

runtime:
  # Local execution detail. Never sent in GZCOORD messages.
  provider: openai
  model: gpt-5.6-sol

subagents:
  enabled: true
  max_parallel: 4
  max_depth: 1
  capabilities:
    analyze: true
    research: true
    review: true
    implement: false
    commit: false
    push: false
    merge: false
    create_pr: false
    architecture_decision: false

transport:
  adapter: telegram
  # Transport-specific credentials/mapping stay outside the protocol.
